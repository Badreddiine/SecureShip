spring.application.name=SecureShip

# Datasource and Redis settings come from environment variables
# (SPRING_DATASOURCE_*, SPRING_DATA_REDIS_*) defined in docker-compose.yml

# Health probes: readiness only becomes UP when PostgreSQL and Redis answer
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.show-details=never

server.shutdown=graceful

# Redis cache TTL for GET /parcels/{id}
app.cache.parcel-ttl=60s