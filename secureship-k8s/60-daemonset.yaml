# DaemonSet: exactly ONE pod on EACH node (typical use: log collector, monitoring agent)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-info
  namespace: secureship
spec:
  selector:
    matchLabels: { app: node-info }
  template:
    metadata:
      labels: { app: node-info }
    spec:
      tolerations:
        # without this, the control-plane taint keeps the pod off that node (2 pods instead of 3)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: logger
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - 'while true; do echo "node=$NODE_NAME pod=$HOSTNAME $(date)"; sleep 30; done'
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }