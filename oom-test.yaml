apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  namespace: secureship
spec:
  restartPolicy: Never
  containers:
    - name: memory-hog
      image: python:3.12-alpine
      command:
        - python
        - -c
        - "x = bytearray(100 * 1024 * 1024); import time; time.sleep(30)"
      resources:
        requests:
          memory: "16Mi"
          cpu: "25m"
        limits:
          memory: "32Mi"
          cpu: "200m"
